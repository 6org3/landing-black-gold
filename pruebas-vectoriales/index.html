  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: #09090B;
    }

    body {
      padding: clamp(18px, 4vw, 64px);
    }

    main {
      width: min(1800px, 100%);
      margin: 0 auto;
    }

    section {
      display: grid;
      gap: clamp(18px, 3vw, 48px);
      align-items: stretch;
    }

    .vectors {
      grid-template-columns: minmax(220px, 0.8fr) minmax(220px, 0.8fr) minmax(360px, 1.4fr);
    }

    .garments {
      grid-template-columns: repeat(2, minmax(320px, 1fr));
      margin-top: clamp(42px, 8vw, 112px);
    }

    a {
      min-width: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid #28282E;
      border-radius: 22px;
      background: #0D0D0F;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 4px solid #FFD700;
      outline-offset: 5px;
    }

    .vectors img {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 84vh;
      object-fit: contain;
    }

    .vectors a:nth-child(-n + 2) img {
      padding: clamp(18px, 4vw, 58px);
    }

    .garments img {
      display: block;
      width: 100%;
      height: auto;
      background: #F4F4F2;
    }

    @media (max-width: 1040px) {
      .vectors,
      .garments {
        grid-template-columns: 1fr;
      }

      .vectors img {
        max-height: none;
      }
    }
  </style>
</head>
